
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Store | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Game Store</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/games}">Inventory</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="p-5 bg-white border rounded-3 shadow-sm">
        <h1 class="display-5 fw-bold">Game Store Inventory</h1>
        <p class="lead text-secondary mt-3">
            Manage your video game inventory in one place.
            View available games, add new titles, update
            existing records, and remove discontinued items.
        </p>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <a th:href="@{/games}" class="btn btn-primary btn-lg">
                View Inventory
            </a>
            <a th:href="@{/games/new}"
               class="btn btn-outline-secondary btn-lg">
                Add New Game
            </a>
        </div>
    </div>
</main>

<footer class="container text-center text-muted py-4">
    <small>CST-323 | Game Store Inventory Management System</small>
</footer>

</body>
</html>
