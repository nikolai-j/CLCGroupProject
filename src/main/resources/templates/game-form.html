
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Store | Game Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Game Store</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link" th:href="@{/games}">Inventory</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">

            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white p-3">
                    <h1 class="h4 mb-0"
                        th:text="${game.id == null}
                            ? 'Add New Game'
                            : 'Edit Game'">
                        Game Form
                    </h1>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/games/save}"
                          th:object="${game}"
                          method="post">

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Game Title
                            </label>
                            <input type="text"
                                   id="title"
                                   th:field="*{title}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('title')}
                                       ? 'is-invalid' : ''"
                                   placeholder="Enter game title"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}">
                                Title error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="gameSystem" class="form-label">
                                Game System
                            </label>
                            <input type="text"
                                   id="gameSystem"
                                   th:field="*{gameSystem}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('gameSystem')}
                                       ? 'is-invalid' : ''"
                                   placeholder="PC, PlayStation 5, Xbox, etc."
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('gameSystem')}"
                                 th:errors="*{gameSystem}">
                                Game system error
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="quantity" class="form-label">
                                Quantity
                            </label>
                            <input type="number"
                                   id="quantity"
                                   th:field="*{quantity}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('quantity')}
                                       ? 'is-invalid' : ''"
                                   min="0"
                                   step="1"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('quantity')}"
                                 th:errors="*{quantity}">
                                Quantity error
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="price" class="form-label">
                                Price ($)
                            </label>
                            <input type="number"
                                   id="price"
                                   th:field="*{price}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('price')}
                                       ? 'is-invalid' : ''"
                                   min="0"
                                   step="0.01"
                                   placeholder="0.00"
                                   required>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('price')}"
                                 th:errors="*{price}">
                                Price error
                            </div>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit"
                                    class="btn btn-primary"
                                    th:text="${game.id == null}
                                        ? 'Add Game'
                                        : 'Save Changes'">
                                Save
                            </button>

                            <a th:href="@{/games}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

</body>
</html>
