
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Store | Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Game Store</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Home</a>
            <a class="nav-link active" th:href="@{/games}">Inventory</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between
                align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Game Inventory</h1>
            <p class="text-muted mb-0">
                View and manage your game catalog.
            </p>
        </div>

        <a th:href="@{/games/new}" class="btn btn-primary">
            Add New Game
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover
                              align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">ID</th>
                        <th scope="col">Title</th>
                        <th scope="col">System</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Price</th>
                        <th scope="col" class="text-end pe-3">
                            Actions
                        </th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="game : ${games}">
                        <td class="ps-3" th:text="${game.id}">1</td>
                        <td th:text="${game.title}">Example Game</td>
                        <td th:text="${game.gameSystem}">PC</td>
                        <td th:text="${game.quantity}">10</td>
                        <td th:text="${'$' + #numbers.formatDecimal(game.price, 1, 2)}">
                            $39.99
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-inline-flex gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/games/edit/{id}(id=${game.id})}">
                                    Edit
                                </a>

                                <form th:action="@{/games/delete/{id}(id=${game.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this game?');">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(games)}">
                        <td colspan="6" class="text-center py-5">
                            <p class="text-muted mb-3">
                                No games found in inventory.
                            </p>
                            <a th:href="@{/games/new}"
                               class="btn btn-primary">
                                Add Your First Game
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}" class="btn btn-outline-secondary">
            Back to Home
        </a>
    </div>
</main>

</body>
</html>
